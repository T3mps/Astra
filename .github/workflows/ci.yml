name: CI

# One workflow, one matrix: OS x configuration (Debug, Release) on pinned
# runner images and pinned compilers, built and tested through the same two
# entry points on every OS (scripts/build.{sh,ps1}, scripts/run-tests.{sh,ps1}),
# each test run twice with two shuffle seeds. docs/ci.md is the reference.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.leg.name }} (${{ matrix.config }})
    runs-on: ${{ matrix.leg.os }}
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
        leg:
          - name: windows-msvc
            os: windows-2025
          - name: linux-gcc-14
            os: ubuntu-24.04
            cc: gcc-14
            cxx: g++-14
            packages: g++-14
          - name: linux-clang-19
            os: ubuntu-24.04
            cc: clang-19
            cxx: clang++-19
            packages: clang-19 libstdc++-14-dev
          - name: macos-apple-clang
            os: macos-15
            xcode: "16.4"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Fixed seed 1 reproduces exactly run to run; the second seed moves with
      # the run number so test-order coupling keeps being probed.
      - name: Seeds
        shell: bash
        run: |
          echo "SEED_FIXED=1" >> "$GITHUB_ENV"
          echo "SEED_RUN=$(( ${{ github.run_number }} % 98999 + 1000 ))" >> "$GITHUB_ENV"

      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.leg.packages }}
          echo "CC=${{ matrix.leg.cc }}" >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.leg.cxx }}" >> "$GITHUB_ENV"
          ${{ matrix.leg.cxx }} --version

      - name: Select Xcode (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -s "/Applications/Xcode_${{ matrix.leg.xcode }}.app"
          # The /usr/bin shims follow xcode-select and add the SDK sysroot;
          # the raw toolchain binaries (xcrun -f) do not.
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
          xcodebuild -version
          clang++ --version

      - name: Build
        id: build-posix
        if: runner.os != 'Windows'
        run: bash scripts/build.sh ${{ matrix.config }}
      - name: Build
        id: build-windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1 ${{ matrix.config }}

      - name: Headers compile standalone
        if: runner.os != 'Windows'
        run: bash ci/check-headers.sh "$CXX" ${{ matrix.config == 'Debug' && 'debug' || 'release' }}

      - name: Test (seed ${{ env.SEED_FIXED }})
        if: runner.os != 'Windows'
        run: bash scripts/run-tests.sh ${{ matrix.config }} --rng-seed "$SEED_FIXED"
      - name: Test (seed ${{ env.SEED_RUN }})
        if: runner.os != 'Windows' && !cancelled() && steps.build-posix.outcome == 'success'
        run: bash scripts/run-tests.sh ${{ matrix.config }} --rng-seed "$SEED_RUN"
      - name: Test (seed ${{ env.SEED_FIXED }})
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/run-tests.ps1 ${{ matrix.config }} --rng-seed $env:SEED_FIXED
      - name: Test (seed ${{ env.SEED_RUN }})
        if: runner.os == 'Windows' && !cancelled() && steps.build-windows.outcome == 'success'
        shell: pwsh
        run: ./scripts/run-tests.ps1 ${{ matrix.config }} --rng-seed $env:SEED_RUN

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ matrix.leg.name }}-${{ matrix.config }}
          path: test-results/
          if-no-files-found: warn

  # Extra lanes, all on ubuntu-24.04 with the pinned Clang 19. Each goes
  # through the same build/test scripts, with a premake option selecting the
  # lane. RTTI-off is the only lane that exercises TypeIdentity's RTTI-off
  # path; the sanitizer lanes catch what MSVC masks (ci/README.md).
  extra:
    name: ${{ matrix.lane.name }} (${{ matrix.lane.config }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        lane:
          - name: linux-no-rtti
            config: Release
            premake: --no-rtti
          - name: linux-no-rtti
            config: Debug
            premake: --no-rtti
          - name: sanitize-asan-ubsan
            config: Debug
            premake: --sanitize=address
          - name: sanitize-tsan
            config: Debug
            premake: --sanitize=thread
    env:
      CC: clang-19
      CXX: clang++-19
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1:abort_on_error=1
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:suppressions=${{ github.workspace }}/ci/tsan-suppressions.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Seeds
        run: |
          echo "SEED_FIXED=1" >> "$GITHUB_ENV"
          echo "SEED_RUN=$(( ${{ github.run_number }} % 98999 + 1000 ))" >> "$GITHUB_ENV"

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 libclang-rt-19-dev libstdc++-14-dev
          clang++-19 --version

      - name: Build
        id: build
        run: bash scripts/build.sh ${{ matrix.lane.config }} ${{ matrix.lane.premake }}

      - name: Test (seed ${{ env.SEED_FIXED }})
        run: bash scripts/run-tests.sh ${{ matrix.lane.config }} --rng-seed "$SEED_FIXED"
      - name: Test (seed ${{ env.SEED_RUN }})
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bash scripts/run-tests.sh ${{ matrix.lane.config }} --rng-seed "$SEED_RUN"

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ matrix.lane.name }}-${{ matrix.lane.config }}
          path: test-results/
          if-no-files-found: warn
