name: CI
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  PREMAKE_VERSION: 5.0.0-beta6

jobs:
  windows-msvc:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release, Dist]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Download premake
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/premake/premake-core/releases/download/v${env:PREMAKE_VERSION}/premake-${env:PREMAKE_VERSION}-windows.zip" -OutFile premake.zip
          Expand-Archive premake.zip -DestinationPath .
      - name: Generate
        run: .\premake5.exe vs2022
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
      - name: Build (${{ matrix.config }})
        run: msbuild Astra.sln /p:Configuration=${{ matrix.config }} /m /v:minimal
      - name: Test
        run: .\bin\${{ matrix.config }}-windows-x86_64\AstraTest\AstraTest.exe --gtest_brief=1 --gtest_shuffle --gtest_random_seed=${{ github.run_number }}

  # Pinned compilers, not the runner default: GCC 14 and Clang 19 (on
  # libstdc++ 14) x Debug / Release. Each lane builds the test suite and the
  # alternate entity-width compile checks, compiles every public header on
  # its own, and runs AstraTest.
  linux:
    name: linux (${{ matrix.toolchain.name }}, ${{ matrix.config.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - name: gcc-14
            cc: gcc-14
            cxx: g++-14
            packages: g++-14
          - name: clang-19
            cc: clang-19
            cxx: clang++-19
            packages: clang-19 libstdc++-14-dev
        config:
          - name: Debug
            make: debug
          - name: Release
            make: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.toolchain.packages }}
          ${{ matrix.toolchain.cxx }} --version
      - name: Download premake
        run: |
          curl -L "https://github.com/premake/premake-core/releases/download/v${PREMAKE_VERSION}/premake-${PREMAKE_VERSION}-linux.tar.gz" | tar xz
      - name: Generate
        run: ./premake5 gmake2
      - name: Build (${{ matrix.config.name }})
        run: make config=${{ matrix.config.make }} AstraTest AstraCompile16 AstraCompile64 -j"$(nproc)" CC=${{ matrix.toolchain.cc }} CXX=${{ matrix.toolchain.cxx }}
      - name: Headers compile standalone
        run: bash ci/check-headers.sh ${{ matrix.toolchain.cxx }} ${{ matrix.config.make }}
      - name: Test
        run: ./bin/${{ matrix.config.name }}-linux-x86_64/AstraTest/AstraTest --gtest_brief=1 --gtest_shuffle --gtest_random_seed=${{ github.run_number }}

  # Proves every Astra header and test builds and passes with RTTI off: Astra is
  # RTTI-free by design (TypeIdentity's type_info discriminator is guarded), and
  # this is the only lane that exercises the RTTI-off identity path.
  linux-no-rtti:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Download premake
        run: |
          curl -L "https://github.com/premake/premake-core/releases/download/v${PREMAKE_VERSION}/premake-${PREMAKE_VERSION}-linux.tar.gz" | tar xz
      - name: Generate (RTTI off)
        run: ./premake5 gmake2 --no-rtti
      - name: Build (Release, AstraTest)
        run: make config=release AstraTest -j"$(nproc)" CC=clang CXX=clang++
      - name: Test (RTTI off, Release)
        run: ./bin/Release-linux-x86_64/AstraTest/AstraTest --gtest_brief=1 --gtest_shuffle --gtest_random_seed=${{ github.run_number }}
      - name: Build (Debug, AstraTest)
        run: make config=debug AstraTest -j"$(nproc)" CC=clang CXX=clang++
      - name: Test (RTTI off, Debug)
        run: ./bin/Debug-linux-x86_64/AstraTest/AstraTest --gtest_brief=1 --gtest_shuffle --gtest_random_seed=${{ github.run_number }}

  sanitize-asan-ubsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Download premake
        run: |
          curl -L "https://github.com/premake/premake-core/releases/download/v${PREMAKE_VERSION}/premake-${PREMAKE_VERSION}-linux.tar.gz" | tar xz
      - name: Generate (ASan+UBSan)
        run: ./premake5 gmake2 --sanitize=address
      - name: Build (Debug, AstraTest)
        run: make config=debug AstraTest -j"$(nproc)" CC=clang CXX=clang++
      - name: Test (ASan+UBSan)
        env:
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1:abort_on_error=1
        run: ./bin/Debug-linux-x86_64/AstraTest/AstraTest --gtest_brief=1 --gtest_shuffle --gtest_random_seed=${{ github.run_number }}

  sanitize-tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Download premake
        run: |
          curl -L "https://github.com/premake/premake-core/releases/download/v${PREMAKE_VERSION}/premake-${PREMAKE_VERSION}-linux.tar.gz" | tar xz
      - name: Generate (TSan)
        run: ./premake5 gmake2 --sanitize=thread
      - name: Build (Debug, AstraTest)
        run: make config=debug AstraTest -j"$(nproc)" CC=clang CXX=clang++
      - name: Test (TSan)
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:suppressions=ci/tsan-suppressions.txt
        run: ./bin/Debug-linux-x86_64/AstraTest/AstraTest --gtest_brief=1 --gtest_shuffle --gtest_random_seed=${{ github.run_number }}
